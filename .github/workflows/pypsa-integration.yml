name: PyPSA integration
on:
  push:
  pull_request:
jobs:
  solve-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and HiGHS
        run: python -m pip install -e '.[dev]'
      - name: Run LUT conversion and PyPSA solver integration tests
        run: python -m pytest -q tests/test_hourly.py tests/test_benchmark.py tests/test_authentic_annual.py tests/test_scenarios.py
      - name: Run actual small PyPSA optimization and export results
        run: |
          mkdir -p outputs/ci
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from lut_to_pypsa.hourly import build_load_network
          from lut_to_pypsa.benchmark import solve_illustrative
          snapshots=pd.date_range('2020-01-01',periods=24,freq='h')
          source=pd.read_csv('data/derived/lut_continents_2020_verified.csv')
          assert len(source)==5 and source.value_twh.sum()>20000
          hourly=pd.concat([
              pd.DataFrame({'timestamp':snapshots,'region':row.region,
                            'p_set_mw':row.value_twh*1e6/8784})
              for row in source.itertuples(index=False)
          ],ignore_index=True)
          network,summary=solve_illustrative(hourly)
          assert len(network.snapshots)==24, f'snapshots={len(network.snapshots)}'
          assert len(network.generators)==2*len(source), f'generators={len(network.generators)}; regions={len(source)}'
          assert summary.unserved_energy_mwh.abs().max()<1e-5, summary.to_string(index=False)
          assert summary.balance_residual_mwh.abs().max()<1e-5, summary.to_string(index=False)
          expected_mwh=source.value_twh.sum()*1e6*24/8784
          actual_mwh=summary.demand_mwh.sum()
          print(f'Expected 24h MWh: {expected_mwh:.9f}; actual: {actual_mwh:.9f}')
          assert abs(actual_mwh-expected_mwh)<max(1e-3,expected_mwh*1e-9), f'actual={actual_mwh}, expected={expected_mwh}'
          summary.to_csv('outputs/ci/illustrative_dispatch_summary.csv',index=False)
          network.export_to_netcdf('outputs/ci/illustrative_solved_network.nc')
          print(summary.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-lut-derived-24h-pypsa-ci
          path: outputs/ci/
          if-no-files-found: ignore
