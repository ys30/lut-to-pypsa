name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m lut_to_pypsa --data data/synthetic --output synthetic_network.nc
      - run: python -m lut_to_pypsa --data data/synthetic --output optimized_network.nc --optimize
