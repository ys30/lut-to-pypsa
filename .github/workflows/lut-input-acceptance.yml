name: LUT input and parameter acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run LUT-to-PyPSA regression tests
        run: python -m pytest -q --tb=short -ra --junitxml=outputs/pytest-results.xml
      - name: Run storage parameter and evidence regression tests separately
        if: failure()
        run: python -m pytest -vv --tb=long tests/test_parameter_adapter.py tests/test_parameter_evidence.py tests/test_technology_parameters.py
      - name: Export audited 2020 LUT numerical acceptance
        run: |
          python -m lut_to_pypsa.input_acceptance data/derived/lut_continents_2020_verified.csv --year 2020 --output outputs/lut_input_acceptance
      - name: Upload numerical acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lut-2020-input-acceptance
          path: |
            outputs/lut_input_acceptance/
            outputs/pytest-results.xml
          if-no-files-found: warn
