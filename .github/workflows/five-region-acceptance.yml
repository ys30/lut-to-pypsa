name: Five-region LUT illustrative acceptance

on:
  push:
    paths:
      - "src/lut_to_pypsa/**"
      - "tests/test_five_region_pipeline.py"
      - "tests/test_regional_dispatch.py"
      - "tests/test_readme_figures.py"
      - "tests/test_diurnal_hourly.py"
      - "docs/figures/**"
      - "README.md"
      - "tests/test_analytical_sensitivity.py"
      - "tests/test_sensitivity_solver_crosscheck.py"
      - "tests/test_five_region_analytical_baseline.py"
      - "data/derived/lut_continents_2020_verified.csv"
      - "data/derived/five_region_2020_analytical_expectations.csv"
      - ".github/workflows/five-region-acceptance.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  five-region:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and solver
        run: python -m pip install -e '.[dev]'
      - name: Audit analytical baseline independently of solver
        run: python -m pytest -q tests/test_five_region_analytical_baseline.py tests/test_analytical_sensitivity.py tests/test_readme_figures.py tests/test_diurnal_hourly.py
      - name: Run five-region acceptance test
        run: python -m pytest -q tests/test_regional_dispatch.py tests/test_five_region_pipeline.py tests/test_sensitivity_solver_crosscheck.py -k "not test_five_region_full_2020_solve"
      - name: Run 24-hour five-region solver smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from lut_to_pypsa.hourly import hourly_flat, build_load_network
          from lut_to_pypsa.benchmark import add_illustrative_supply
          from lut_to_pypsa.regional_dispatch import solve_regional_dispatch
          annual = pd.read_csv("data/derived/lut_continents_2020_verified.csv")
          hourly = hourly_flat(annual, 2020)
          first_day = hourly.loc[hourly.timestamp < pd.Timestamp("2020-01-02")]
          network = add_illustrative_supply(build_load_network(first_day))
          solved, audit, status, condition = solve_regional_dispatch(network)
          assert (status, condition) == ("ok", "optimal")
          assert len(audit) == 5 and len(solved.snapshots) == 24
          assert audit.max_abs_balance_mw.max() < 1e-5
          print(audit.to_string(index=False))
          PY
      - name: Export independent analytical capacity sensitivity
        run: |
          python -m lut_to_pypsa.analytical_sensitivity \
            --annual data/derived/lut_continents_2020_verified.csv \
            --output outputs/five_region/analytical_sensitivity.csv
          python - <<'PY'
          import pandas as pd
          p = "outputs/five_region/analytical_sensitivity.csv"
          result = pd.read_csv(p)
          assert len(result) == 20
          assert result.region.nunique() == 5
          assert set(result.assumed_firm_capacity_factor) == {1.0, 0.75, 0.5, 0.25}
          assert (result.firm_generation_mwh + result.shortage_generation_mwh
                  - result.demand_mwh).abs().max() < 0.01
          PY
      - name: Run full-year illustrative five-region solve
        run: |
          python -m lut_to_pypsa.five_region_pipeline \
            --annual data/derived/lut_continents_2020_verified.csv \
            --year 2020 \
            --output outputs/five_region
      - name: Check artifact existence and summary
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("outputs/five_region")
          audit=pd.read_csv(p/"regional_dispatch_audit.csv")
          energy=pd.read_csv(p/"annual_energy_check.csv")
          assert len(audit)==5 and len(energy)==5
          assert set(audit.solver_status)=={"ok"}
          assert set(audit.termination_condition)=={"optimal"}
          assert audit.max_abs_balance_mw.max()<1e-5
          assert energy.difference_mwh.abs().max()<0.01
          assert (p/"illustrative_five_region_solved.nc").stat().st_size>0
          hourly=pd.read_csv(p/"lut_hourly_flat_loads.csv")
          assert len(hourly)==8784*5
          assert hourly.region.nunique()==5
          assert hourly.timestamp.nunique()==8784
          assert {"firm_generation_mwh", "shortage_generation_mwh",
                  "shortage_fraction", "illustrative_dispatch_cost",
                  "assumed_reserve_margin"}.issubset(audit)
          assert (audit.firm_generation_mwh + audit.shortage_generation_mwh
                  - audit.demand_mwh).abs().max()<0.01
          assert audit.shortage_generation_mwh.abs().max()<0.01
          assert audit.illustrative_dispatch_cost.notna().all()
          expected=pd.read_csv("data/derived/five_region_2020_analytical_expectations.csv")
          merged=audit.merge(expected, left_on="region", right_on="region", validate="one_to_one")
          assert len(merged)==5
          assert (merged.demand_mwh-merged.expected_annual_mwh).abs().max()<0.01
          assert (merged.illustrative_dispatch_cost-
                  merged.expected_illustrative_cost_units).abs().max()<1.0
          assert (merged.shortage_generation_mwh-
                  merged.expected_shortage_mwh).abs().max()<0.01
          print(audit.to_string(index=False))
          PY
      - name: Solve full-year 50-percent firm-capacity stress scenario
        run: |
          python -m lut_to_pypsa.five_region_pipeline \
            --annual data/derived/lut_continents_2020_verified.csv \
            --year 2020 \
            --firm-capacity-factor 0.5 \
            --output outputs/five_region_stress50
      - name: Verify full-year stress dispatch against independent reference
        run: |
          python - <<'PY'
          import pandas as pd
          from lut_to_pypsa.analytical_sensitivity import expected_dispatch
          source = "data/derived/lut_continents_2020_verified.csv"
          audit = pd.read_csv("outputs/five_region_stress50/regional_dispatch_audit.csv")
          reference = expected_dispatch(source, firm_capacity_factor=0.5)
          comparison = audit.merge(reference, on="region", suffixes=("_solver", "_expected"), validate="one_to_one")
          assert len(comparison) == 5
          assert set(comparison.solver_status) == {"ok"}
          assert set(comparison.termination_condition) == {"optimal"}
          assert comparison.max_abs_balance_mw.max() < 1e-5
          for field in ("demand_mwh", "firm_generation_mwh", "shortage_generation_mwh",
                        "shortage_fraction", "illustrative_dispatch_cost"):
              actual = comparison[f"{field}_solver"]
              expected = comparison[f"{field}_expected"]
              assert ((actual - expected).abs() <= (0.01 + 1e-9 * expected.abs())).all(), field
          assert (comparison.shortage_generation_mwh_solver > 0).all()
          comparison.to_csv("outputs/five_region_stress50/solver_vs_analytical.csv", index=False)
          print(comparison[["region", "shortage_fraction_solver",
                            "shortage_generation_mwh_solver"]].to_string(index=False))
          PY
      - name: Solve remaining full-year capacity sensitivity scenarios
        run: |
          for factor in 0.75 0.25; do
            label="${factor/./}"
            python -m lut_to_pypsa.five_region_pipeline \
              --annual data/derived/lut_continents_2020_verified.csv \
              --year 2020 \
              --firm-capacity-factor "$factor" \
              --output "outputs/five_region_factor_${label}"
          done
      - name: Cross-check all four annual solver scenarios
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from lut_to_pypsa.analytical_sensitivity import expected_dispatch
          source = "data/derived/lut_continents_2020_verified.csv"
          scenarios = [(1.0, "outputs/five_region"),
                       (0.75, "outputs/five_region_factor_075"),
                       (0.5, "outputs/five_region_stress50"),
                       (0.25, "outputs/five_region_factor_025")]
          results = []
          for factor, directory in scenarios:
              audit = pd.read_csv(Path(directory) / "regional_dispatch_audit.csv")
              reference = expected_dispatch(source, firm_capacity_factor=factor)
              merged = audit.merge(reference, on="region", suffixes=("_solver", "_expected"), validate="one_to_one")
              assert len(merged) == 5
              assert set(merged.solver_status) == {"ok"}
              assert set(merged.termination_condition) == {"optimal"}
              assert merged.max_abs_balance_mw.max() < 1e-5
              for field in ("demand_mwh", "firm_generation_mwh", "shortage_generation_mwh",
                            "shortage_fraction", "illustrative_dispatch_cost"):
                  actual = merged[f"{field}_solver"]
                  expected = merged[f"{field}_expected"]
                  assert ((actual - expected).abs() <= (0.01 + 1e-9 * expected.abs())).all(), (factor, field)
              merged["capacity_factor"] = factor
              results.append(merged)
          combined = pd.concat(results, ignore_index=True)
          assert len(combined) == 20
          combined.to_csv("outputs/five_region/solver_sensitivity_all_four.csv", index=False)
          print(combined.groupby("capacity_factor").agg(
              shortage_mwh=("shortage_generation_mwh_solver", "sum"),
              shortage_fraction=("shortage_fraction_solver", "mean")).to_string())
          PY
      - name: Solve full-year synthetic diurnal load sensitivity
        run: |
          python -m lut_to_pypsa.five_region_pipeline \
            --annual data/derived/lut_continents_2020_verified.csv \
            --year 2020 \
            --load-profile diurnal \
            --diurnal-amplitude 0.20 \
            --firm-capacity-factor 0.5 \
            --output outputs/five_region_diurnal_stress50
      - name: Audit diurnal versus flat load sensitivity
        run: |
          python - <<'PY'
          import pandas as pd
          flat = pd.read_csv("outputs/five_region_stress50/regional_dispatch_audit.csv")
          shaped = pd.read_csv("outputs/five_region_diurnal_stress50/regional_dispatch_audit.csv")
          hourly = pd.read_csv("outputs/five_region_diurnal_stress50/lut_hourly_diurnal_loads.csv")
          assert len(hourly) == 8784 * 5
          assert hourly.groupby("region").p_set_mw.nunique().min() > 1
          merged = flat.merge(shaped, on="region", suffixes=("_flat", "_diurnal"), validate="one_to_one")
          assert len(merged) == 5
          assert set(shaped.solver_status) == {"ok"}
          assert set(shaped.termination_condition) == {"optimal"}
          assert shaped.max_abs_balance_mw.max() < 1e-5
          assert (merged.demand_mwh_flat - merged.demand_mwh_diurnal).abs().max() < 0.01
          assert (merged.shortage_fraction_diurnal >= 0).all()
          assert (merged.shortage_fraction_diurnal <= 1).all()
          merged["shortage_delta_percentage_points"] = 100 * (
              merged.shortage_fraction_diurnal - merged.shortage_fraction_flat)
          merged["shortage_delta_twh"] = (
              merged.shortage_generation_mwh_diurnal - merged.shortage_generation_mwh_flat) / 1e6
          assert merged.shortage_delta_percentage_points.notna().all()
          assert merged.shortage_delta_twh.notna().all()
          merged.to_csv("outputs/five_region/diurnal_vs_flat_solver.csv", index=False)
          total_flat = merged.shortage_generation_mwh_flat.sum() / 1e6
          total_diurnal = merged.shortage_generation_mwh_diurnal.sum() / 1e6
          with open("outputs/five_region/diurnal_sensitivity_summary.md", "w", encoding="utf-8") as f:
              f.write("# Illustrative diurnal versus flat full-year dispatch\\n\\n")
              f.write("Both cases use the same source-traced LUT annual demand, 50% assumed firm capacity factor, and 10% reserve margin.\\n\\n")
              f.write(f"Flat shortage proxy: {total_flat:,.3f} TWh\\n\\n")
              f.write(f"Diurnal shortage proxy: {total_diurnal:,.3f} TWh\\n\\n")
              f.write(f"Change: {total_diurnal-total_flat:+,.3f} TWh\\n\\n")
              f.write("This is an illustrative optimization sensitivity, not observed outages or empirical calibration.\\n")
          print("Flat shortage proxy TWh:", total_flat)
          print("Diurnal shortage proxy TWh:", total_diurnal)
          print("Delta TWh:", total_diurnal-total_flat)
          print(merged[["region", "shortage_fraction_flat", "shortage_fraction_diurnal"]].to_string(index=False))
          PY
      - name: Solve fixed-capacity diurnal control
        run: |
          python -m lut_to_pypsa.five_region_pipeline \
            --annual data/derived/lut_continents_2020_verified.csv \
            --year 2020 \
            --load-profile diurnal \
            --diurnal-amplitude 0.20 \
            --firm-capacity-factor 0.5 \
            --capacity-reference flat_reference \
            --output outputs/five_region_diurnal_fixed_capacity
      - name: Audit fixed capacity and isolate load-shape effect
        run: |
          python - <<'PY'
          import pandas as pd
          flat = pd.read_csv("outputs/five_region_stress50/regional_dispatch_audit.csv")
          fixed = pd.read_csv("outputs/five_region_diurnal_fixed_capacity/regional_dispatch_audit.csv")
          variable = pd.read_csv("outputs/five_region_diurnal_stress50/regional_dispatch_audit.csv")
          result = flat.merge(fixed, on="region", suffixes=("_flat", "_fixed"), validate="one_to_one")
          result = result.merge(variable[["region", "firm_capacity_mw", "shortage_generation_mwh"]],
                                on="region", validate="one_to_one")
          assert len(result) == 5
          assert set(fixed.solver_status) == {"ok"}
          assert set(fixed.termination_condition) == {"optimal"}
          assert (result.firm_capacity_mw_flat - result.firm_capacity_mw_fixed).abs().max() < 1e-5
          assert (result.demand_mwh_flat - result.demand_mwh_fixed).abs().max() < 0.01
          assert fixed.max_abs_balance_mw.max() < 1e-5
          result["load_shape_only_delta_twh"] = (
              result.shortage_generation_mwh_fixed - result.shortage_generation_mwh_flat) / 1e6
          result["capacity_resizing_delta_twh"] = (
              result.shortage_generation_mwh - result.shortage_generation_mwh_fixed) / 1e6
          result.to_csv("outputs/five_region/fixed_capacity_diurnal_control.csv", index=False)
          print("Flat shortage TWh:", result.shortage_generation_mwh_flat.sum()/1e6)
          print("Fixed-capacity diurnal shortage TWh:", result.shortage_generation_mwh_fixed.sum()/1e6)
          print("Peak-resized diurnal shortage TWh:", result.shortage_generation_mwh.sum()/1e6)
          print("Load-shape-only delta TWh:", result.load_shape_only_delta_twh.sum())
          print("Capacity-resizing delta TWh:", result.capacity_resizing_delta_twh.sum())
          PY
      - name: Solve full-year time-varying firm availability with fixed capacity
        run: |
          for profile in flat diurnal; do
            python -m lut_to_pypsa.five_region_pipeline \
              --annual data/derived/lut_continents_2020_verified.csv \
              --year 2020 \
              --load-profile "$profile" \
              --diurnal-amplitude 0.20 \
              --firm-capacity-factor 0.5 \
              --capacity-reference flat_reference \
              --firm-availability-amplitude 0.4 \
              --output "outputs/five_region_availability40_${profile}"
          done
      - name: Audit fixed-capacity time-varying supply comparison
        run: |
          python - <<'PY'
          import pandas as pd
          base = pd.read_csv("outputs/five_region_stress50/regional_dispatch_audit.csv")
          flat = pd.read_csv("outputs/five_region_availability40_flat/regional_dispatch_audit.csv")
          diurnal = pd.read_csv("outputs/five_region_availability40_diurnal/regional_dispatch_audit.csv")
          merged = flat.merge(diurnal, on="region", suffixes=("_flat", "_diurnal"), validate="one_to_one")
          assert len(merged) == 5
          assert set(flat.solver_status) == {"ok"}
          assert set(diurnal.solver_status) == {"ok"}
          assert set(flat.termination_condition) == {"optimal"}
          assert set(diurnal.termination_condition) == {"optimal"}
          assert flat.max_abs_balance_mw.max() < 1e-5
          assert diurnal.max_abs_balance_mw.max() < 1e-5
          assert (merged.firm_capacity_mw_flat - merged.firm_capacity_mw_diurnal).abs().max() < 1e-5
          assert (merged.demand_mwh_flat - merged.demand_mwh_diurnal).abs().max() < 0.01
          assert (flat.shortage_generation_mwh.to_numpy() + 0.01 >= base.shortage_generation_mwh.to_numpy()).all()
          merged["load_shape_delta_twh"] = (
              merged.shortage_generation_mwh_diurnal - merged.shortage_generation_mwh_flat) / 1e6
          merged.to_csv("outputs/five_region/availability40_load_shape_control.csv", index=False)
          print("Availability-dip flat shortage TWh:", merged.shortage_generation_mwh_flat.sum()/1e6)
          print("Availability-dip diurnal shortage TWh:", merged.shortage_generation_mwh_diurnal.sum()/1e6)
          print("Availability-dip load-shape delta TWh:", merged.load_shape_delta_twh.sum())
          PY
      - name: Solve 90-percent firm capacity with synthetic availability dip
        run: |
          for profile in flat diurnal; do
            python -m lut_to_pypsa.five_region_pipeline \
              --annual data/derived/lut_continents_2020_verified.csv \
              --year 2020 \
              --load-profile "$profile" \
              --diurnal-amplitude 0.20 \
              --firm-capacity-factor 0.9 \
              --capacity-reference flat_reference \
              --firm-availability-amplitude 0.4 \
              --output "outputs/five_region_availability40_factor90_${profile}"
          done
      - name: Audit 90-percent capacity load-shape sensitivity
        run: |
          python - <<'PY'
          import pandas as pd
          flat = pd.read_csv("outputs/five_region_availability40_factor90_flat/regional_dispatch_audit.csv")
          diurnal = pd.read_csv("outputs/five_region_availability40_factor90_diurnal/regional_dispatch_audit.csv")
          merged = flat.merge(diurnal, on="region", suffixes=("_flat", "_diurnal"), validate="one_to_one")
          assert len(merged) == 5
          assert set(flat.solver_status) == set(diurnal.solver_status) == {"ok"}
          assert set(flat.termination_condition) == set(diurnal.termination_condition) == {"optimal"}
          assert flat.max_abs_balance_mw.max() < 1e-5 and diurnal.max_abs_balance_mw.max() < 1e-5
          assert (merged.firm_capacity_mw_flat - merged.firm_capacity_mw_diurnal).abs().max() < 1e-5
          assert (merged.demand_mwh_flat - merged.demand_mwh_diurnal).abs().max() < 0.01
          merged["shape_delta_twh"] = (merged.shortage_generation_mwh_diurnal -
                                        merged.shortage_generation_mwh_flat) / 1e6
          merged.to_csv("outputs/five_region/availability40_factor90_shape_control.csv", index=False)
          print("90%-capacity flat shortage TWh:", merged.shortage_generation_mwh_flat.sum()/1e6)
          print("90%-capacity diurnal shortage TWh:", merged.shortage_generation_mwh_diurnal.sum()/1e6)
          print("90%-capacity shape delta TWh:", merged.shape_delta_twh.sum())
          PY
      - name: Solve opposite-phase supply trough at 06:00
        run: |
          python -m lut_to_pypsa.five_region_pipeline \
            --annual data/derived/lut_continents_2020_verified.csv \
            --year 2020 \
            --load-profile diurnal \
            --diurnal-amplitude 0.20 \
            --firm-capacity-factor 0.9 \
            --capacity-reference flat_reference \
            --firm-availability-amplitude 0.4 \
            --availability-trough-hour 6 \
            --output outputs/five_region_availability40_factor90_trough06
      - name: Audit supply-load phase shift
        run: |
          python - <<'PY'
          import pandas as pd
          aligned = pd.read_csv("outputs/five_region_availability40_factor90_diurnal/regional_dispatch_audit.csv")
          shifted = pd.read_csv("outputs/five_region_availability40_factor90_trough06/regional_dispatch_audit.csv")
          merged = aligned.merge(shifted, on="region", suffixes=("_trough18", "_trough06"), validate="one_to_one")
          assert len(merged) == 5
          assert set(shifted.solver_status) == {"ok"}
          assert set(shifted.termination_condition) == {"optimal"}
          assert shifted.max_abs_balance_mw.max() < 1e-5
          assert (merged.demand_mwh_trough18 - merged.demand_mwh_trough06).abs().max() < 0.01
          assert (merged.firm_capacity_mw_trough18 - merged.firm_capacity_mw_trough06).abs().max() < 1e-5
          merged["phase_shift_delta_twh"] = (
              merged.shortage_generation_mwh_trough06 - merged.shortage_generation_mwh_trough18) / 1e6
          merged.to_csv("outputs/five_region/availability_phase_shift_control.csv", index=False)
          print("Trough18 diurnal shortage TWh:", merged.shortage_generation_mwh_trough18.sum()/1e6)
          print("Trough06 diurnal shortage TWh:", merged.shortage_generation_mwh_trough06.sum()/1e6)
          print("Phase shift delta TWh:", merged.phase_shift_delta_twh.sum())
          PY
      - name: Solve 00:00 and 12:00 supply trough sensitivity
        run: |
          for hour in 0 12; do
            python -m lut_to_pypsa.five_region_pipeline \
              --annual data/derived/lut_continents_2020_verified.csv \
              --year 2020 \
              --load-profile diurnal \
              --diurnal-amplitude 0.20 \
              --firm-capacity-factor 0.9 \
              --capacity-reference flat_reference \
              --firm-availability-amplitude 0.4 \
              --availability-trough-hour "$hour" \
              --output "outputs/five_region_availability40_factor90_trough${hour}"
          done
      - name: Audit four-phase sensitivity curve
        run: |
          python - <<'PY'
          import pandas as pd
          paths = {
              0: "outputs/five_region_availability40_factor90_trough0/regional_dispatch_audit.csv",
              6: "outputs/five_region_availability40_factor90_trough06/regional_dispatch_audit.csv",
              12: "outputs/five_region_availability40_factor90_trough12/regional_dispatch_audit.csv",
              18: "outputs/five_region_availability40_factor90_diurnal/regional_dispatch_audit.csv",
          }
          rows = []
          baseline = None
          for hour, path in paths.items():
              df = pd.read_csv(path).sort_values("region").reset_index(drop=True)
              assert len(df) == 5 and set(df.solver_status) == {"ok"}
              assert set(df.termination_condition) == {"optimal"}
              assert df.max_abs_balance_mw.max() < 1e-5
              if baseline is None:
                  baseline = df
              else:
                  assert (df.demand_mwh - baseline.demand_mwh).abs().max() < 0.01
                  assert (df.firm_capacity_mw - baseline.firm_capacity_mw).abs().max() < 1e-5
              rows.append({"trough_hour": hour, "shortage_proxy_twh": df.shortage_generation_mwh.sum()/1e6})
          out = pd.DataFrame(rows).sort_values("trough_hour")
          out["delta_vs_18_twh"] = out.shortage_proxy_twh - float(out.loc[out.trough_hour == 18, "shortage_proxy_twh"].iloc[0])
          out.to_csv("outputs/five_region/availability_four_phase_sensitivity.csv", index=False)
          print("Four-phase sensitivity TWh:")
          print(out.to_string(index=False))
          PY
      - name: Render validated five-region result figures
        run: |
          python -m pip install matplotlib
          python -m lut_to_pypsa.plot_five_region \
            --base outputs/five_region \
            --stress outputs/five_region_stress50 \
            --output outputs/figures
          python - <<'PY'
          from pathlib import Path
          figures = list(Path("outputs/figures").glob("five_region_*.png"))
          assert len(figures) == 3
          assert all(p.stat().st_size > 10000 for p in figures)
          print([str(p) for p in figures])
          PY
      - name: Publish acceptance summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          summary = ["## Five-region LUT-to-PyPSA acceptance",
                     "Supply is illustrative; LUT inputs are annual energy-service demand.",
                     ""]
          for name in ("analytical_sensitivity.csv", "regional_dispatch_audit.csv", "../five_region_stress50/solver_vs_analytical.csv", "availability40_factor90_shape_control.csv", "availability_phase_shift_control.csv"):
              path = Path("outputs/five_region") / name
              if path.exists():
                  frame = pd.read_csv(path)
                  summary += [f"### {name}", f"Rows: {len(frame)}", "",
                              "```csv", frame.to_csv(index=False), "```", ""]
              else:
                  summary += [f"### {name}", "Not produced in this run.", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-region-illustrative-results
          path: |
            outputs/five_region/
            outputs/five_region_stress50/
            outputs/five_region_factor_075/regional_dispatch_audit.csv
            outputs/five_region_factor_025/regional_dispatch_audit.csv
            outputs/figures/
            outputs/five_region_diurnal_stress50/regional_dispatch_audit.csv
