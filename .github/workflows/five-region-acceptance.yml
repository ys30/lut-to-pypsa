name: Five-region LUT illustrative acceptance

on:
  push:
    paths:
      - "src/lut_to_pypsa/**"
      - "tests/test_five_region_pipeline.py"
      - "tests/test_regional_dispatch.py"
      - "tests/test_analytical_sensitivity.py"
      - "tests/test_sensitivity_solver_crosscheck.py"
      - "tests/test_five_region_analytical_baseline.py"
      - "data/derived/lut_continents_2020_verified.csv"
      - "data/derived/five_region_2020_analytical_expectations.csv"
      - ".github/workflows/five-region-acceptance.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  five-region:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and solver
        run: python -m pip install -e '.[dev]'
      - name: Audit analytical baseline independently of solver
        run: python -m pytest -q tests/test_five_region_analytical_baseline.py tests/test_analytical_sensitivity.py
      - name: Run five-region acceptance test
        run: python -m pytest -q tests/test_regional_dispatch.py tests/test_five_region_pipeline.py tests/test_sensitivity_solver_crosscheck.py -k "not test_five_region_full_2020_solve"
      - name: Run 24-hour five-region solver smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from lut_to_pypsa.hourly import hourly_flat, build_load_network
          from lut_to_pypsa.benchmark import add_illustrative_supply
          from lut_to_pypsa.regional_dispatch import solve_regional_dispatch
          annual = pd.read_csv("data/derived/lut_continents_2020_verified.csv")
          hourly = hourly_flat(annual, 2020)
          first_day = hourly.loc[hourly.timestamp < pd.Timestamp("2020-01-02")]
          network = add_illustrative_supply(build_load_network(first_day))
          solved, audit, status, condition = solve_regional_dispatch(network)
          assert (status, condition) == ("ok", "optimal")
          assert len(audit) == 5 and len(solved.snapshots) == 24
          assert audit.max_abs_balance_mw.max() < 1e-5
          print(audit.to_string(index=False))
          PY
      - name: Export independent analytical capacity sensitivity
        run: |
          python -m lut_to_pypsa.analytical_sensitivity \
            --annual data/derived/lut_continents_2020_verified.csv \
            --output outputs/five_region/analytical_sensitivity.csv
          python - <<'PY'
          import pandas as pd
          p = "outputs/five_region/analytical_sensitivity.csv"
          result = pd.read_csv(p)
          assert len(result) == 20
          assert result.region.nunique() == 5
          assert set(result.assumed_firm_capacity_factor) == {1.0, 0.75, 0.5, 0.25}
          assert (result.firm_generation_mwh + result.shortage_generation_mwh
                  - result.demand_mwh).abs().max() < 0.01
          PY
      - name: Run full-year illustrative five-region solve
        run: |
          python -m lut_to_pypsa.five_region_pipeline \
            --annual data/derived/lut_continents_2020_verified.csv \
            --year 2020 \
            --output outputs/five_region
      - name: Check artifact existence and summary
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("outputs/five_region")
          audit=pd.read_csv(p/"regional_dispatch_audit.csv")
          energy=pd.read_csv(p/"annual_energy_check.csv")
          assert len(audit)==5 and len(energy)==5
          assert set(audit.solver_status)=={"ok"}
          assert set(audit.termination_condition)=={"optimal"}
          assert audit.max_abs_balance_mw.max()<1e-5
          assert energy.difference_mwh.abs().max()<0.01
          assert (p/"illustrative_five_region_solved.nc").stat().st_size>0
          hourly=pd.read_csv(p/"lut_hourly_flat_loads.csv")
          assert len(hourly)==8784*5
          assert hourly.region.nunique()==5
          assert hourly.timestamp.nunique()==8784
          assert {"firm_generation_mwh", "shortage_generation_mwh",
                  "shortage_fraction", "illustrative_dispatch_cost",
                  "assumed_reserve_margin"}.issubset(audit)
          assert (audit.firm_generation_mwh + audit.shortage_generation_mwh
                  - audit.demand_mwh).abs().max()<0.01
          assert audit.shortage_generation_mwh.abs().max()<0.01
          assert audit.illustrative_dispatch_cost.notna().all()
          expected=pd.read_csv("data/derived/five_region_2020_analytical_expectations.csv")
          merged=audit.merge(expected, left_on="region", right_on="region", validate="one_to_one")
          assert len(merged)==5
          assert (merged.demand_mwh-merged.expected_annual_mwh).abs().max()<0.01
          assert (merged.illustrative_dispatch_cost-
                  merged.expected_illustrative_cost_units).abs().max()<1.0
          assert (merged.shortage_generation_mwh-
                  merged.expected_shortage_mwh).abs().max()<0.01
          print(audit.to_string(index=False))
          PY
      - name: Solve full-year 50-percent firm-capacity stress scenario
        run: |
          python -m lut_to_pypsa.five_region_pipeline \
            --annual data/derived/lut_continents_2020_verified.csv \
            --year 2020 \
            --firm-capacity-factor 0.5 \
            --output outputs/five_region_stress50
      - name: Verify full-year stress dispatch against independent reference
        run: |
          python - <<'PY'
          import pandas as pd
          from lut_to_pypsa.analytical_sensitivity import expected_dispatch
          source = "data/derived/lut_continents_2020_verified.csv"
          audit = pd.read_csv("outputs/five_region_stress50/regional_dispatch_audit.csv")
          reference = expected_dispatch(source, firm_capacity_factor=0.5)
          comparison = audit.merge(reference, on="region", suffixes=("_solver", "_expected"), validate="one_to_one")
          assert len(comparison) == 5
          assert set(comparison.solver_status) == {"ok"}
          assert set(comparison.termination_condition) == {"optimal"}
          assert comparison.max_abs_balance_mw.max() < 1e-5
          for field in ("demand_mwh", "firm_generation_mwh", "shortage_generation_mwh",
                        "shortage_fraction", "illustrative_dispatch_cost"):
              actual = comparison[f"{field}_solver"]
              expected = comparison[f"{field}_expected"]
              assert ((actual - expected).abs() <= (0.01 + 1e-9 * expected.abs())).all(), field
          assert (comparison.shortage_generation_mwh_solver > 0).all()
          comparison.to_csv("outputs/five_region_stress50/solver_vs_analytical.csv", index=False)
          print(comparison[["region", "shortage_fraction_solver",
                            "shortage_generation_mwh_solver"]].to_string(index=False))
          PY
      - name: Render validated five-region result figures
        run: |
          python -m pip install matplotlib
          python -m lut_to_pypsa.plot_five_region \
            --base outputs/five_region \
            --stress outputs/five_region_stress50 \
            --output outputs/figures
          python - <<'PY'
          from pathlib import Path
          figures = list(Path("outputs/figures").glob("five_region_*.png"))
          assert len(figures) == 3
          assert all(p.stat().st_size > 10000 for p in figures)
          print([str(p) for p in figures])
          PY
      - name: Publish acceptance summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          summary = ["## Five-region LUT-to-PyPSA acceptance",
                     "Supply is illustrative; LUT inputs are annual energy-service demand.",
                     ""]
          for name in ("analytical_sensitivity.csv", "regional_dispatch_audit.csv", "../five_region_stress50/solver_vs_analytical.csv"):
              path = Path("outputs/five_region") / name
              if path.exists():
                  frame = pd.read_csv(path)
                  summary += [f"### {name}", f"Rows: {len(frame)}", "",
                              "```csv", frame.to_csv(index=False), "```", ""]
              else:
                  summary += [f"### {name}", "Not produced in this run.", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-region-illustrative-results
          path: |
            outputs/five_region/
            outputs/five_region_stress50/
            outputs/figures/
          if-no-files-found: warn
