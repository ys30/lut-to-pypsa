[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lut-to-pypsa-validation"
version = "0.1.0"
description = "Synthetic demonstration of LUT-style data harmonization and PyPSA validation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pypsa>=0.35,<2"]
[project.optional-dependencies]
dev = ["pytest>=8", "highspy", "jupyterlab", "nbclient", "ipykernel"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
