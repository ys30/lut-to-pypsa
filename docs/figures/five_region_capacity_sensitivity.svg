t><text x="585" y="397" text-anchor="middle" font-family="Arial" font-size="15">75%</text><circle cx="825" cy="370" r="8" fill="#cc6677" stroke="white" stroke-width="2"/><text x="825" y="353" text-anchor="middle" font-family="Arial" font-size="15" fill="#18263a">0%</text><text x="825" y="397" text-anchor="middle" font-family="Arial" font-size="15">100%</text><text x="450" y="438" text-anchor="middle" font-family="Arial" font-size="16">Assumed firm-capacity factor</text><text x="450" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#526479">Modeled annual unmet demand (% of total demand)</text><text x="44" y="461" font-family="Arial" font-size="12" fill="#526479">Illustrative flat-load, disconnected-bus benchmark · shortage proxy is not an observed outage rate</text></svg>